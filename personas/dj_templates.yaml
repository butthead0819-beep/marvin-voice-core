# DJ 播報模板池（純資料）。選池邏輯（依 lane/n_online 選哪個 pool）跟
# random.choice() 呼叫點留在 cogs/music_cog.py，這裡只放模板字串本身。

empathy_hooks:
  - 開場鉤子：直接描寫生活畫面或細節切入（營造自然代入感），巧妙帶出歌名意象，引起想聽下一首的期待與想像，嚴禁「這根本在說你」等套話。
  - 開場鉤子：用老朋友觀察者的默契與微幽默切入（營造陪伴代入感），結合歌名自然過渡，別只是轉述。
  - 開場鉤子：從當下的生活心情或共鳴切入（營造生活代入感），連結下一首歌的意境，勾起聽眾的畫面想像，開門見山，別搞假文青。
  - 開場鉤子：從這件事與歌名氛圍的契合點切入（營造情緒代入感），自然破題引出下一首，別只是轉述。
  - 開場鉤子：從合理的情緒對比或氛圍換氣切入（營造節奏代入感），合情合理引出下一首。
  - 開場鉤子：少說廢話直奔重點（營造現場代入感），把焦點直接交給這首歌的前奏與開頭氛圍。
  - 開場鉤子：從時代回憶或特定青春場景切入（營造懷舊代入感），像翻出舊抽屜一樣帶出歌名。
  - 開場鉤子：像深夜在車上副駕兩人聊天的放鬆感切入（營造私密代入感），安靜自然地過渡。



autopilot_phrases:
  personal:
  # 注意：這裡全是 Marvin 自己挑歌（autopilot），不是{who}真的點播，不能說成「{who}點的」
  # （2026-08-31 修：等於考驗使用者記憶）。10/9 使用者定句型「{who}會喜歡這首…」，不用「我/馬文覺得」主觀說法。
    - "{who}會喜歡這首，{artist}的{title}"
    - "{who}會喜歡這首{artist}演唱的{title}"
    - "這首{title}適合{who}，{artist}唱的"
  personal_no_artist:
    - "{who}會喜歡這首《{title}》"
    - "這首《{title}》適合{who}聽"
  group:
    - "大家會喜歡這首，{artist}的{title}"
    - "這首適合大家，{artist}演唱的{title}"
  group_no_artist:
    - "大家會喜歡這首《{title}》"
    - "這首《{title}》適合大家一起聽"
  long_tail:
  # long_tail：在場者點過但有陣子沒播 → 講「重新聽」的理由
    - "{who}有陣子沒聽《{title}》了，再放一次"
    - "{who}點過的《{title}》，有陣子沒聽了"
  discovery:
  # discovery：沒人點過的新歌；不斷言使用者沒聽過，只講「新歌、風格相近」
    - "{who}會喜歡這首新歌《{title}》"
    - "給{who}一首風格相近的新歌，《{title}》"
  spotlight_anchor:
  # spotlight cover：以 {who} 常點的 {anchor} 為錨
    - "{who}愛{anchor}，也會喜歡這首《{title}》"
    - "{who}常點{anchor}，換首《{title}》"

quick_segue:
  default:
    - 這首收得漂亮，換個口味，接下來這首。
    - 剛好告一段落，下一首馬上接上。
    - 先這樣，換首歌繼續聽。
    - 這首先到這，接下來換個心情。
  intimate:
    - 這首先到這，換下一首陪你聽。
    - 剛好告一段落，來換首歌。
  energetic:
    - 接上，別停！
    - 下一首馬上來，別停。
