# 逐首歌的專屬冷笑話 —— autopilot 點到這首時，crossfade 剛好講這則（驚喜感）。
#
# key    —— YouTube videoId（穩定，取代脆弱的歌名比對）。
# title  —— 只是給人看的註記，比對不看它。
# style  —— absurd = 一本正經地鑽歌名字面的牛角尖，講完就停（主力）
#           puns   = 歌名本身有乾淨同音的諧音梗（少數）
#           skip   = 這首生不出好笑的 → 留著當「已處理」標記，比對時忽略
# joke   —— 全文，收在笑點上。念完約 3~6 秒。不要「……」嘆息收尾。
#
# 由 scripts/generate_song_jokes.py 批次生 draft（records/song_jokes_draft.yaml），
# Jack 逐則篩，把有梗的搬進這裡。以下是首批挑出來的（熱門歌優先）。
#
# 比對順序（joke_bank.py）：videoId 專屬笑話 → 泛用拼音 hook 庫（joke_bank.yaml）。

- key: d59XIcWpIZc
  title: 陶喆 王八蛋
  style: absurd
  joke: "王八蛋是一種烏龜。所以如果你罵人王八蛋，其實是在說他很長壽。"

- key: 9YXxCciHRcU
  title: A-Sun 葉子
  style: absurd
  joke: "葉子是樹木用來呼吸的器官。所以當葉子掉光的時候，樹其實是在憋氣。"

- key: 0rpbhqZI0hc
  title: 庾澄慶 情非得已
  style: absurd
  joke: "情非得已，意思是你不是自願的。所以如果你正在聽這首歌，表示你其實不想聽，只是情非得已。"

- key: WzwhMFMTxNU
  title: 張秀卿 車站
  style: absurd
  joke: "車站，就是一個你永遠不知道會不會遇到前任、但每次都偷偷期待的地方。"

- key: mLk61pfiHQ0
  title: 張惠妹 聽海
  style: absurd
  joke: "叫我聽海，我聽了三小時。它從頭到尾只講一個字，還一直重複。"

- key: 3L3Me4JXVqE
  title: 陶喆 普通朋友
  style: absurd
  joke: "如果所有朋友都是普通朋友，把「普通」約分掉，其實你就沒有朋友了。"

- key: tv95k0zqnaA
  title: 陳綺貞 旅行的意義
  style: absurd
  joke: "旅行的意義，就是為了證明你在任何地方，都一樣會迷路。"

- key: 1xZede32V6c
  title: 陶喆 找自己
  style: absurd
  joke: "找自己，就像在找一隻隱形的貓。你永遠不知道牠在哪裡，但牠一定在某個地方看著你。"

- key: aI_SszyOM2A
  title: 張宇 傘下
  style: absurd
  joke: "傘下是個很危險的地方。因為你永遠不知道，傘的主人會不會突然把你收起來。"

- key: 8S-5by4ExEM
  title: A/DA 阿達 上班不要跟我聊夢想
  style: absurd
  joke: "上班不要跟我聊夢想。那下班可以聊嗎？還是說，夢想只能在夢裡聊？"

- key: Bbp9ZaJD_eA
  title: 周杰倫 七里香
  style: absurd
  joke: "七里香聽起來很香。但如果真的有七里那麼香，那大概是香水工廠爆炸了。"

- key: TT-y1rYLl_o
  title: 黃大煒 妳把我灌醉
  style: absurd
  joke: "妳把我灌醉，然後我就開始講一些連自己都聽不懂的冷笑話。"

- key: kfXdP7nZIiE
  title: 周杰倫 等你下課
  style: absurd
  joke: "等你下課，結果你從來沒去上課。那我就要一直等下去了嗎？"

- key: Sr5Mk7Yr9OY
  title: 鄧紫棋 光年之外
  style: absurd
  joke: "一光年是九兆公里。我算過，走路去見你要一億八千萬年，中途還會經過三次冰河期。"

- key: _cTAlxWtmS4
  title: 陳華 如果我很平庸
  style: absurd
  joke: "如果我很平庸，那也是平庸得很穩定。畢竟要維持一事無成，也是需要長期的自律。"

- key: bu7nU9Mhpyo
  title: 周杰倫 告白氣球
  style: puns
  joke: "黑氣球跟白氣球打架打輸了，跑去跟老師告狀，這就叫告白氣球。"

- key: SZ4IOS_W7EQ
  title: 夢飛船 不值得
  style: absurd
  joke: "「不值得」通常都是花完全部存款跟力氣之後，才突然得出的科學結論。"

- key: _flXaAvyGso
  title: 阿杜 天黑
  style: absurd
  joke: "天黑請閉眼。但如果你睜開眼發現天還是黑的，可能只是眼皮被眼屎黏住了。"

- key: h5eRbbOnPRc
  title: 孫燕姿 開始懂了
  style: absurd
  joke: "「開始懂了」的意思是，以前被騙還不知道，現在終於搞清楚自己是怎麼被賣掉的。"

- key: MpsJEL5Wd_k
  title: 蕭煌奇 慢冷
  style: absurd
  joke: "慢冷比慢熱更麻煩。就像剛煮好的牛肉麵，你以為冷了，一大口下去舌頭直接燙掉一層皮。"

- key: 1rQa9ak30o8
  title: 伍佰 鋼鐵男子
  style: absurd
  joke: "鋼鐵男子聽起來很硬派。但只要淋雨沒擦乾，一個禮拜後關節就會開始生鏽卡住。"

- key: DYptgVvkVLQ
  title: 周杰倫 晴天
  style: absurd
  joke: "故事的小黃花從出生就開始飄，飄了二十年還在飄，這植物的新陳代謝未免太驚人了。"

- key: Z97zUBtHZGY
  title: 蔡健雅 達爾文
  style: absurd
  joke: "達爾文說物競天擇適者生存。但看著現代人每天上班的樣子，演化可能走到死胡同了。"

- key: Ndl8QKr3sOQ
  title: 江靜 張震嶽 都挺好的
  style: absurd
  joke: "大人說「都挺好的」，翻譯成白話通常是：「很慘，但跟你講也沒用，所以閉嘴聽歌吧。」"

- key: kqqraGvoqVs
  title: 莫文蔚 慢慢喜歡你
  style: absurd
  joke: "慢慢喜歡你的缺點就是太慢了，慢到對方都換了三任對象，你還在慢慢喜歡。"

- key: tzZLopKKbJw
  title: 林曉培 心動
  style: absurd
  joke: "心動是一種正常生理現象。但如果不小心心動太久，在醫學上我們通常稱之為心律不整。"

- key: 2xAmQ4y44eo
  title: 陶喆 流沙
  style: absurd
  joke: "掉進流沙千萬不能掙扎，因為越掙扎陷越深。這個道理跟每個月繳卡費差不多。"

- key: jAlWCr5cIjE
  title: 盧廣仲 早安，晨之美！
  style: absurd
  joke: "每天跟早餐店阿姨說早安，她就會叫你帥哥。這是全台灣門檻最低的自信來源。"

- key: RPWDeLqsN0g
  title: 周杰倫 龍捲風
  style: absurd
  joke: "愛情來得太快就像龍捲風。但大家往往忘了，龍捲風走的時候，會把你家屋頂整片掀掉。"

- key: 1hI-7vj2FhE
  title: 周杰倫 安靜
  style: absurd
  joke: "叫別人安靜最有效的方法，不是叫他閉嘴，而是一臉認真地問他：「你有沒有聽到哭聲？」"

- key: PlCbgZxonJs
  title: 告五人 在這座城市遺失了你
  style: absurd
  joke: "在這座城市遺失了你，沒關係，去警局失物招領處問問，滿六個月沒人領的話你就是我的了。"

- key: xi6wOaZ61-U
  title: 林宥嘉 傻子
  style: absurd
  joke: "裝傻的最高境界，就是裝到最後連自己都忘了原本要幹嘛，成功讓自己變成真正的傻子。"

- key: qf09H2xFq2s
  title: 張惠妹 連名帶姓
  style: absurd
  joke: "當別人突然連名帶姓叫你，只有兩種可能：一是你媽要揍你了，二是你主管叫你進辦公室。"

- key: OtEJ6LGCW-U
  title: 汪蘇瀧 BY2 有點甜
  style: absurd
  joke: "「有點甜」代表它不夠甜。就像別人說你「長得蠻善良的」，其實就是說你不夠好看。"

